const terms=[
 ['anime','Аниме','source'],['kyo','Kyoto Animation','source','anime','KyoAni'],['kon','K-ON!','source','kyo'],['euph','Hibike! Euphonium','source','kyo','Sound! Euphonium'],['aclan','CLANNAD','source','kyo'],
 ['vn','Визуальная новелла','source',null,'ВН'],['vclan','CLANNAD','source','vn'],['umi','Umineko','source','vn'],['ep','Episode 1','source','umi'],
 ['game','Игра','source'],['witch','The Witcher 3','source','game'],['blood','Blood and Wine','source','witch'],['civ','Civilization V','source','game'],
 ['film','Фильм','source'],['inception','Inception','source','film'],['series','Сериал','source'],['mirror','Black Mirror','source','series'],['song','Песня','source'],
 ['piano','Piano','genre'],['rock','Rock','genre'],['amb','Dark Ambient','genre'],['orch','Orchestral','genre'],['el','Electronic','genre'],
 ['calm','Спокойная','mood'],['fast','Быстрая','mood'],['myst','Загадочная','mood'],['agg','Агрессивная','mood'],
 ['ost','Без вокала (OST)','voice'],['voc','С вокалом','voice',null,'vocals'],['male','Мужской','voice','voc'],['female','Женский','voice','voc'],['both','Оба голоса','voice','voc'],
 ['op','Опенинг','extra'],['cover','Cover','extra',null,'Кавер'],['remix','Remix','extra',null,'Ремикс'],['end','Эндинг','extra']
].map(([id,name,group,parent,alias])=>({id,name,group,parent,alias}));
const byId=Object.fromEntries(terms.map(t=>[t.id,t]));
function chain(id){const t=byId[id];return t.parent?[...chain(t.parent),id]:[id]}
const pathName=t=>[ids[t.group],...chain(t.id).map(id=>byId[id].name)].join(' › ');
const albums=[
 ['桜','#b67496','#f4ddd9'],['海','#487a91','#d2e4da'],['月','#9a798c','#f0e0c9'],
 ['森','#698e7c','#dddabe'],['夜','#76739a','#e0d3d7'],['光','#ab805e','#f5d7af']
];
const tracks=[
 ['Вечер после репетиции','kon','piano','calm','ost',0,176,'amb'],['На другом берегу','ep','amb','myst','ost',1,219],
 ['Письмо домой','vclan','piano','calm','female',2,207,'aclan,end'],['Виноградники Туссента','blood','orch','calm','ost',3,194],
 ['Взять высокую ноту','euph','orch','fast','ost',4,155],['Свет на крыше','song','el','fast','both',5,233,'cover'],
 ['До первого звонка','kon','rock','fast','female',0,186,'op'],['Город во сне','inception','orch','myst','ost',4,282],
 ['Голос из эфира','mirror','el','myst','male',1,214],['Дорога к морю','aclan','piano','calm','ost',2,249],
 ['Новый рассвет','civ','orch','calm','ost',3,209],['Шум прибоя','umi','amb','myst','both',1,201],
 ['Эхо в коридоре','kon','piano','myst','ost',0,115],['После бури','witch','orch','agg','ost',3,195],
 ['Лиловый неон','song','el','fast','female',5,225,'remix'],['Обратная сторона','mirror','amb','myst','ost',1,126],
 ['На бис','kon','rock','fast','both',0,185,'cover,end'],['Тихий перрон','vclan','piano','calm','ost',2,252],
 ['Дальний сигнал','civ','el','myst','ost',3,143],['Финальный аккорд','euph','orch','calm','ost',4,210],
 ['Вальс под дождём','blood','orch','myst','ost',3,201],['Красная луна','ep','el','agg','female',1,218],
 ['Ночной поезд','song','amb','calm','voc',5,249],['Утренний этюд','euph','piano','calm','ost',4,120]
].map(([name,source,genre,mood,voice,art,seconds,extra=''],i)=>{
 const values=[source,genre,mood,voice,...extra.split(',').filter(Boolean)];
 const matches=new Set(values.flatMap(chain)); if(voice==='both'){matches.add('male');matches.add('female')}
 return {i,name,source,genre,mood,voice,art,seconds,values,matches,favorite:i%5===0,kind:i%4===0?'video':'audio',provider:i%3===0?'youtube':'local'}
});
const state={flat:false,selected:new Set(),logic:'and',voices:new Set(),groups:new Set(['source']),branches:new Set(['anime','kyo']),queries:{},flatQuery:'',grid:false,favorite:false,kind:'',provider:''};
let playing=false,elapsed=0,queue=tracks,at=0,shown=[],lastDetail=null;
function norm(s){return s.trim().toLocaleLowerCase()}
function matchesTerm(t,q){return [t.name,t.alias||''].some(x=>norm(x).includes(norm(q)))}
function textMatch(item){
 const q=norm($('mainQuery').value); if(!q)return true;
 return [item.name,...Array.from(item.matches).flatMap(id=>[byId[id].name,byId[id].alias||''])].some(x=>norm(x).includes(q))
}
function toggleVoice(voice){
 if(voice==='ost'){
  const wasSelected=state.voices.has('ost');
  state.voices.clear();
  if(!wasSelected)state.voices.add('ost');
 }else{
  state.voices.delete('ost');
  toggle(state.voices,voice);
 }
}
function matchesPerformance(item){
 if(state.voices.size===2)return item.matches.has('voc');
 for(const voice of state.voices)if(!item.matches.has(voice))return false;
 return true;
}
function passesQuickFilters(item){
 return (!state.kind || item.kind===state.kind)
  && matchesPerformance(item)
  && (!state.provider || item.provider===state.provider)
  && (!state.favorite || item.favorite) && textMatch(item);
}
function passes(item){
 if(!passesQuickFilters(item))return false;
 const tags=[...state.selected];
 if(!tags.length)return true;
 return state.logic==='and'?tags.every(id=>item.matches.has(id)):tags.some(id=>item.matches.has(id));
}
function tally(t){return tracks.filter(item=>passesQuickFilters(item)&&item.matches.has(t.id)).length}
const time=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function art(i){const [glyph,bg,fg]=albums[i];return '<div aria-hidden="true" class="art sleeve'+i+'" style="--art:'+bg+';--light:'+fg+'"><b>'+glyph+'</b></div>'}
function expandButton(id,open,label){return '<button class="disclose" aria-label="'+esc(label)+'" aria-expanded="'+open+'" data-branch="'+id+'">'+icon('chevron','chev')+'</button>'}
function setMode(id,value){$(id).setAttribute('aria-pressed',String(value))}
function option(t,flat=false){
 return '<button class="node" data-pick="'+t.id+'" aria-pressed="'+state.selected.has(t.id)+'"><span class="check" aria-hidden="true">✓</span><span class="caption">'+esc(t.name)+(flat?'<small class="path">'+esc(t.parent?chain(t.parent).map(x=>byId[x].name).join(' › '):ids[t.group])+'</small>':'')+'</span><span class="number">'+tally(t)+'</span></button>'
}
function searchBox(group,value,placeholder){
 return '<label class="field local">'+icon('search')+'<input type="search" data-query="'+group+'" aria-label="'+placeholder+'" placeholder="'+(group==='flat'?placeholder:'Поиск в разделе')+'" value="'+esc(value)+'"></label>'
}
function treeNode(t,q){
 const children=terms.filter(k=>k.parent===t.id);
 const childrenHtml=children.map(k=>treeNode(k,q)).join('');
 if(q&&!matchesTerm(t,q)&&!childrenHtml)return '';
 const open=state.branches.has(t.id)||Boolean(q);
 return '<div><div class="branch">'+(children.length?expandButton(t.id,open,(open?'Свернуть ':'Раскрыть ')+t.name):'<span class="spacer"></span>')+option(t)+'</div>'+(children.length&&open?'<div class="children">'+childrenHtml+'</div>':'')+'</div>'
}
function chip(id,full=false){
 const term=byId[id],path=pathName(term),name=full?path:term.name;
 return '<button class="chip" data-pick="'+id+'" title="'+esc(path)+'" aria-label="Снять '+esc(path)+'"><span class="'+(full?'':'chip-label')+'">'+esc(name)+'</span><span class="remove" aria-hidden="true">×</span></button>';
}
function drawSelection(){
 const selected=[...state.selected];
 $('selectionLine').hidden=!selected.length;
 $('selectedCount').textContent='Выбрано: '+selected.length;
 $('active').innerHTML=selected.slice(0,3).map(id=>chip(id)).join('')+
  (selected.length>3?'<button class="more-chips" id="allChosen" aria-haspopup="dialog">Ещё '+(selected.length-3)+'</button>':'');
 if($('chosenDialog').open)$('chosenList').innerHTML=selected.map(id=>chip(id,true)).join('');
}
function groupHtml(g){
 const open=state.groups.has(g),q=state.queries[g]||'';
 const rows=terms.filter(t=>t.group===g&&!t.parent).map(t=>treeNode(t,q)).join('');
 return '<section class="group"><button class="group-head" aria-expanded="'+open+'" data-group="'+g+'">'+icon(symbols[g],g+'-color')+ids[g]+'<i class="push"></i>'+icon('chevron','chev')+'</button>'+(open?'<div class="group-content"><div class="group-interior">'+searchBox(g,q,'Найти в разделе «'+ids[g]+'»')+(rows||'<div class="empty">Совпадений нет</div>')+'</div></div>':'')+'</section>'
}
function drawCatalog(animate){
 const panel=$('catalog'),scroll=panel.scrollTop,el=document.activeElement;
 const current=el?.dataset.query,selection=el?.selectionStart;
 let html;
 if(state.flat){
  const q=state.flatQuery;
  const found=terms.filter(t=>t.group!=='voice'&&matchesTerm(t,q)).sort((a,b)=>q?a.name.localeCompare(b.name,'ru'):tally(b)-tally(a)||a.name.localeCompare(b.name,'ru'));
  html='<div class="flat">'+searchBox('flat',q,'Название или псевдоним')+found.map(t=>option(t,true)).join('')+(!found.length?'<div class="empty">Совпадений нет</div>':'')+'</div>'
 }else html=['source','genre','mood','extra'].map(groupHtml).join('');
 panel.innerHTML=html;panel.scrollTop=scroll;
 if(current){
  const next=panel.querySelector('[data-query="'+current+'"]');if(next){next.focus({preventScroll:true});next.setSelectionRange(selection,selection)}
 }
 if(animate){
  const host=panel.querySelector('[data-group="'+animate+'"],[data-branch="'+animate+'"]');
  const content=host?.classList.contains('group-head')?host.nextElementSibling:host?.parentElement.nextElementSibling;
  content?.classList.add('opening','group-content');
 }
 setMode('treeMode',!state.flat);setMode('flatMode',state.flat);
 drawSelection();
 document.querySelectorAll('[data-logic]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.logic===state.logic)));
 document.querySelectorAll('[data-voice]').forEach(b=>b.setAttribute('aria-pressed',String(state.voices.has(b.dataset.voice))));
}
function renderEntries(){
 shown=tracks.filter(item=>passes(item));
 $('count').textContent='Найдено: '+shown.length;
 const list=$('entries');list.classList.toggle('grid',state.grid);
 $('playResults').disabled=!shown.length;
 const slim=state.grid?list.clientWidth/2<460:list.clientWidth<470;
 const limit=slim?1:3;
 list.innerHTML=shown.map(t=>{
  const reps=['source','genre','mood'].slice(0,limit).map(g=>{
   const values=t.values.filter(id=>byId[id].group===g);
   return values.find(id=>state.selected.has(id))||values.sort((a,b)=>byId[a].name.localeCompare(byId[b].name,'ru'))[0]
  });
  const tags=reps.map(id=>{const v=byId[id];return '<button class="tag '+v.group+'" data-pick="'+id+'" title="'+esc(pathName(v))+'">'+icon(symbols[v.group])+'<span>'+esc(v.name)+'</span></button>'}).join('');
  const more=t.values.length-reps.length-1;
  const details='<button class="more" data-detail="'+t.i+'" aria-label="Разметка: '+esc(t.name)+'">'+(more?'+'+more:'···')+'</button>';
  return '<article class="entry">'+art(t.art)+'<div class="identity"><strong class="name">'+esc(t.name)+'</strong><div class="tags">'+tags+details+'</div></div><span class="voice" role="img" aria-label="'+esc(byId[t.voice].name)+'" title="'+esc(byId[t.voice].name)+'">'+icon(t.voice==='ost'?'sound':'mic')+'</span><span class="duration">'+time(t.seconds)+'</span></article>'
 }).join('')||'<div class="empty">Ничего не найдено. Снимите условие или измените запрос.</div>';
 setMode('listView',!state.grid);setMode('cardView',state.grid);setMode('favorites',state.favorite);
}
function redraw(animate){drawCatalog(animate);renderEntries()}
function toggle(set,id){if(set.has(id))set.delete(id);else set.add(id)}
function focusAt(attr,val,scope=document){scope.querySelector('['+attr+'="'+val+'"]')?.focus({preventScroll:true})}
function detail(i,button){
 const t=tracks[i],pop=$('detail');lastDetail=i;
 pop.innerHTML='<h3>'+esc(t.name)+'</h3>'+Object.keys(ids).map(g=>{
  const vals=t.values.filter(id=>byId[id].group===g);if(!vals.length)return '';
  if(g==='voice'&&t.voice==='voc')return '<div class="detail-line"><b>Исполнение</b><button data-pick="voc" title="Показать весь вокал">С вокалом · голос не указан</button></div>';
  return '<div class="detail-line"><b>'+ids[g]+'</b><span>'+vals.map(id=>'<button data-pick="'+id+'">'+esc(chain(id).map(x=>byId[x].name).join(' › '))+'</button>').join('<br>')+'</span></div>'
 }).join('');pop.showPopover();const r=button.getBoundingClientRect(),h=pop.offsetHeight;
 pop.style.left=Math.max(6,Math.min(r.left,innerWidth-pop.offsetWidth-8))+'px';
 pop.style.top=Math.max(6,(r.bottom+h+8<innerHeight?r.bottom+5:r.top-h-5))+'px';
 pop.querySelector('button')?.focus({preventScroll:true})
}
$('detail').addEventListener('toggle',e=>{if(e.newState==='closed'&&lastDetail!==null)focusAt('data-detail',lastDetail)});
function drawDock(){
 const item=queue[at];if(!item)return;
 const tmp=document.createElement('div');tmp.innerHTML=art(item.art);const a=tmp.firstElementChild;a.id='dockArt';$('dockArt').replaceWith(a);
 $('dockName').textContent=item.name;$('dockSource').textContent=byId[item.source].name;$('dockPlay').innerHTML=icon(playing?'pause':'play');$('dockPlay').setAttribute('aria-label',playing?'Приостановить демонстрацию':'Запустить демонстрацию');
 $('trackTime').textContent=time(item.seconds);drawTime()
}
function drawTime(){$('elapsed').textContent=time(elapsed);$('meter').style.width=(elapsed/queue[at].seconds*100)+'%'}
function next(){at=(at+1)%queue.length;elapsed=0;drawDock()}
setInterval(()=>{if(playing){elapsed++;if(elapsed>=queue[at].seconds)next();else drawTime()}},1000);
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.pick){
  const inside=$('detail').contains(b);const origin=$('entries').contains(b)?$('entries'):$('catalog');
  const dialog=$('chosenDialog'),fromDialog=dialog.contains(b);
  if(inside)$('detail').hidePopover();
  if(byId[d.pick].group==='voice'){
   state.voices=new Set(d.pick==='both'||d.pick==='voc'?['male','female']:[d.pick]);
  }else toggle(state.selected,d.pick);
  redraw();
  if(fromDialog){
   if(state.selected.size){($('chosenList').querySelector('button')||$('closeChosen')).focus()}
   else dialog.close();
   return;
  }
  if(inside)focusAt('data-detail',lastDetail);else if(b.classList.contains('chip')){$('active').querySelector('button')?.focus({preventScroll:true});if(!state.selected.size)$(state.flat?'flatMode':'treeMode').focus({preventScroll:true})}
  else focusAt('data-pick',d.pick,origin);
 }else if(d.group||d.branch){
  const attr=d.group?'group':'branch',id=d[attr],sel='[data-'+attr+'="'+id+'"]';
  const container=ctrl=>d.group?ctrl.closest('.group'):ctrl.closest('.branch').parentElement;
  const oldHeight=container(b).getBoundingClientRect().height;
  toggle(d.group?state.groups:state.branches,id);drawCatalog(id);focusAt('data-'+attr,id);
  const after=container($('catalog').querySelector(sel)),newHeight=after.getBoundingClientRect().height;
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&oldHeight!==newHeight){
   after.animate([{height:oldHeight+'px',overflow:'clip'},{height:newHeight+'px',overflow:'clip'}],{duration:155,easing:'ease-out'})
  }
 }else if(d.logic){state.logic=d.logic;redraw()}
 else if(d.voice){toggleVoice(d.voice);redraw()}
 else if(b.id==='allChosen'){
  $('chosenDialog').showModal();drawSelection();$('closeChosen').focus();
 }else if(b.id==='closeChosen')$('chosenDialog').close();
 else if(d.detail!==undefined)detail(Number(d.detail),b);
 else if(b.id==='clear'){state.selected.clear();state.logic='and';redraw();$(state.flat?'flatMode':'treeMode').focus()}
 else if(b.id==='treeMode'||b.id==='flatMode'){state.flat=b.id==='flatMode';drawCatalog();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)$('catalog').animate([{opacity:.65},{opacity:1}],{duration:130});if(state.flat)$('catalog').querySelector('input').focus({preventScroll:true})}
 else if(b.id==='listView'||b.id==='cardView'){state.grid=b.id==='cardView';renderEntries()}
 else if(d.kind!==undefined){
  state.kind=d.kind;document.querySelectorAll('[data-kind]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.kind===state.kind)));redraw()
 }else if(b.id==='advancedButton'){
  const advanced=$('advanced');advanced.hidden=!advanced.hidden;b.setAttribute('aria-expanded',String(!advanced.hidden))
 }else if(b.id==='favorites'){state.favorite=!state.favorite;redraw()}
 else if(b.id==='playResults'&&shown.length){queue=[...shown];at=0;elapsed=0;playing=true;drawDock()}
 else if(b.id==='dockPlay'){playing=!playing;drawDock()}else if(b.id==='dockNext')next()
});
document.addEventListener('input',event=>{
 const q=event.target.dataset.query;
 if(q){if(q==='flat')state.flatQuery=event.target.value;else state.queries[q]=event.target.value;drawCatalog()}
 else if(event.target.id==='mainQuery')redraw()
});
$('provider').addEventListener('change',e=>{state.provider=e.target.value;redraw()});
$('chosenDialog').addEventListener('close',()=>($('allChosen')||$('active').querySelector('button')||$('treeMode')).focus({preventScroll:true}));
const splitter=$('splitter'),layout=document.querySelector('.layout'),panel=$('tagPanel');
const widthKey='hibiki:demo09:tag-panel-width';
let preferredWidth=null,dragStart=null;
try {const saved=Number(localStorage.getItem(widthKey));if(saved>0)preferredWidth=saved}catch{}
function widthLimits(){
 const css=getComputedStyle(layout);
 const space=layout.clientWidth-parseFloat(css.paddingLeft)-parseFloat(css.paddingRight)-parseFloat(css.columnGap);
 const max=Math.max(144,Math.min(560,Math.floor(space*(innerWidth<740?.55:.56))));
 return {min:Math.min(248,max),max};
}
function applyWidth(){
 const {min,max}=widthLimits();
 if(preferredWidth===null)layout.style.removeProperty('--panel-width');
 else layout.style.setProperty('--panel-width',Math.min(max,Math.max(min,preferredWidth))+'px');
 const width=Math.round(panel.getBoundingClientRect().width);
 for(const [key,value] of Object.entries({valuemin:min,valuemax:max,valuenow:width,valuetext:width+' пикселей'}))splitter.setAttribute('aria-'+key,value);
}
function rememberWidth(){
 try {if(preferredWidth===null)localStorage.removeItem(widthKey);else localStorage.setItem(widthKey,String(preferredWidth))}catch{}
}
function resizePanel(requested){
 const {min,max}=widthLimits();
 preferredWidth=Math.min(max,Math.max(min,Math.round(requested)));applyWidth();
}
splitter.addEventListener('pointerdown',e=>{
 if(!e.isPrimary||e.button!==0)return;
 dragStart={id:e.pointerId,x:e.clientX,width:panel.getBoundingClientRect().width};
 splitter.focus({preventScroll:true});splitter.setPointerCapture(e.pointerId);splitter.classList.add('dragging');
});
splitter.addEventListener('pointermove',e=>{if(dragStart?.id===e.pointerId)resizePanel(dragStart.width+dragStart.x-e.clientX)});
splitter.addEventListener('lostpointercapture',()=>{dragStart=null;splitter.classList.remove('dragging');rememberWidth()});
function resetWidth(){preferredWidth=null;applyWidth();rememberWidth()}
splitter.addEventListener('dblclick',resetWidth);
splitter.addEventListener('keydown',e=>{
 const {min,max}=widthLimits(),width=panel.getBoundingClientRect().width;
 const sizes={ArrowLeft:width+16,ArrowRight:width-16,Home:min,End:max};
 if(e.key==='Enter'){e.preventDefault();resetWidth()}
 else if(Object.hasOwn(sizes,e.key)){e.preventDefault();resizePanel(sizes[e.key]);rememberWidth()}
});
window.addEventListener('resize',applyWidth);
let pending,lastListWidth=0;
new ResizeObserver(([entry])=>{
 if(entry.contentRect.width===lastListWidth)return;
 lastListWidth=entry.contentRect.width;cancelAnimationFrame(pending);pending=requestAnimationFrame(renderEntries);
}).observe($('entries').parentElement);
applyWidth();
redraw();drawDock();
</script>
</body>
</html>
